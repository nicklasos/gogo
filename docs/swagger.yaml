basePath: /
definitions:
  app_internal_errs.ErrorResponse:
    properties:
      details:
        additionalProperties: true
        type: object
      error_key:
        type: string
      message:
        type: string
      status:
        type: integer
      timestamp:
        type: string
    required:
    - error_key
    - status
    type: object
  internal.PaginationMeta:
    properties:
      current_page:
        type: integer
      last_page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
    required:
    - current_page
    - last_page
    - per_page
    - total
    type: object
  internal_auth.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  internal_auth.LoginDataResponse:
    properties:
      data:
        $ref: '#/definitions/internal_auth.LoginResponse'
    required:
    - data
    type: object
  internal_auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  internal_auth.LoginResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/internal_auth.UserResponse'
    required:
    - access_token
    - refresh_token
    - user
    type: object
  internal_auth.MessageResponse:
    properties:
      data:
        properties:
          message:
            type: string
        required:
        - message
        type: object
    required:
    - data
    type: object
  internal_auth.RefreshTokenDataResponse:
    properties:
      data:
        $ref: '#/definitions/internal_auth.RefreshTokenResponse'
    required:
    - data
    type: object
  internal_auth.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  internal_auth.RefreshTokenResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    required:
    - access_token
    - refresh_token
    type: object
  internal_auth.RegisterDataResponse:
    properties:
      data:
        $ref: '#/definitions/internal_auth.RegisterResponse'
    required:
    - data
    type: object
  internal_auth.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - name
    - password
    type: object
  internal_auth.RegisterResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/internal_auth.UserResponse'
    required:
    - access_token
    - refresh_token
    - user
    type: object
  internal_auth.ResetPasswordRequest:
    properties:
      password:
        minLength: 8
        type: string
      token:
        type: string
    required:
    - password
    - token
    type: object
  internal_auth.UpdatePasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        minLength: 8
        type: string
    required:
    - current_password
    - new_password
    type: object
  internal_auth.UpdateProfileRequest:
    properties:
      email:
        type: string
      name:
        type: string
    required:
    - email
    - name
    type: object
  internal_auth.UserDataResponse:
    properties:
      data:
        $ref: '#/definitions/internal_auth.UserResponse'
    required:
    - data
    type: object
  internal_auth.UserResponse:
    properties:
      email:
        type: string
      email_verified:
        type: boolean
      id:
        type: integer
      name:
        type: string
      roles:
        items:
          type: string
        type: array
    required:
    - email
    - email_verified
    - id
    - name
    - roles
    type: object
  internal_auth.VerifyEmailRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  internal_example.CreateExampleRequest:
    properties:
      description:
        type: string
      title:
        type: string
    required:
    - title
    type: object
  internal_example.ExampleDataResponse:
    properties:
      data:
        $ref: '#/definitions/internal_example.ExampleResponse'
    required:
    - data
    type: object
  internal_example.ExampleResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      title:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    required:
    - created_at
    - description
    - id
    - title
    - updated_at
    - user_id
    type: object
  internal_example.MessageResponse:
    properties:
      data:
        properties:
          message:
            type: string
        required:
        - message
        type: object
    required:
    - data
    type: object
  internal_example.PaginatedExamplesResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/internal_example.ExampleResponse'
        type: array
      pagination:
        $ref: '#/definitions/internal.PaginationMeta'
    required:
    - data
    - pagination
    type: object
  internal_example.UpdateExampleRequest:
    properties:
      description:
        type: string
      title:
        type: string
    required:
    - title
    type: object
  internal_uploads.MessageResponse:
    properties:
      data:
        properties:
          message:
            type: string
        required:
        - message
        type: object
    required:
    - data
    type: object
  internal_uploads.PaginatedUploadsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/internal_uploads.UploadResponse'
        type: array
      pagination:
        $ref: '#/definitions/internal.PaginationMeta'
    required:
    - data
    - pagination
    type: object
  internal_uploads.UploadDataResponse:
    properties:
      data:
        $ref: '#/definitions/internal_uploads.UploadResponse'
    required:
    - data
    type: object
  internal_uploads.UploadResponse:
    properties:
      created_at:
        type: string
      file_size:
        type: integer
      folder_id:
        type: integer
      full_url:
        type: string
      id:
        type: integer
      mime_type:
        type: string
      original_filename:
        type: string
      relative_path:
        type: string
      type:
        enum:
        - image
        - video
        - audio
        - document
        - other
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    required:
    - created_at
    - file_size
    - folder_id
    - full_url
    - id
    - mime_type
    - original_filename
    - relative_path
    - type
    - updated_at
    - user_id
    type: object
  internal_users.CreateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 8
        type: string
      role:
        enum:
        - super-admin
        - admin
        - user
        type: string
    required:
    - email
    - name
    - password
    - role
    type: object
  internal_users.MessageResponse:
    properties:
      data:
        properties:
          message:
            type: string
        required:
        - message
        type: object
    required:
    - data
    type: object
  internal_users.PaginatedUsersResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/internal_users.UserResponse'
        type: array
      pagination:
        $ref: '#/definitions/internal.PaginationMeta'
    required:
    - data
    - pagination
    type: object
  internal_users.SetPasswordRequest:
    properties:
      password:
        minLength: 8
        type: string
    required:
    - password
    type: object
  internal_users.UpdateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
    required:
    - email
    - name
    type: object
  internal_users.UserDataResponse:
    properties:
      data:
        $ref: '#/definitions/internal_users.UserResponse'
    required:
    - data
    type: object
  internal_users.UserResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      id:
        type: integer
      name:
        type: string
      roles:
        items:
          type: string
        type: array
      updated_at:
        type: string
    required:
    - created_at
    - email
    - email_verified
    - id
    - name
    - roles
    - updated_at
    type: object
host: localhost:8181
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: A production-ready Go API template with authentication and CRUD examples
  license:
    name: WTFPL
    url: http://www.wtfpl.net/
  termsOfService: http://swagger.io/terms/
  title: Gogo API Template
  version: "1.0"
paths:
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Emails a single-use reset link when the address belongs to an account.
        Always answers 200, so it does not reveal which emails are registered.
      parameters:
      - description: Account email
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      summary: Request a password reset
      tags:
      - auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user with email and password
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.LoginDataResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      summary: Login user
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Logout the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout user
      tags:
      - auth
  /api/v1/auth/me:
    get:
      consumes:
      - application/json
      description: Get information about the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.UserDataResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user info
      tags:
      - auth
    put:
      consumes:
      - application/json
      description: Update name and email for the currently authenticated user
      parameters:
      - description: Profile update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.UserDataResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update current user
      tags:
      - auth
  /api/v1/auth/me/password:
    put:
      consumes:
      - application/json
      description: Change password for the currently authenticated user. Revokes all
        refresh tokens.
      parameters:
      - description: Password change
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.UpdatePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change current user password
      tags:
      - auth
  /api/v1/auth/me/verify-email:
    post:
      consumes:
      - application/json
      description: Sends a new verification link to the current user's email address
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Resend verification email
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Refresh the access token using a valid refresh token
      parameters:
      - description: Refresh token request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.RefreshTokenDataResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      summary: Refresh access token
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account with email and password
      parameters:
      - description: Registration request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.RegisterDataResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      summary: Register new user
      tags:
      - auth
  /api/v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Sets a new password with the token from the emailed link. The link
        works once; all sessions are signed out.
      parameters:
      - description: Token and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      summary: Reset password
      tags:
      - auth
  /api/v1/auth/verify-email:
    post:
      consumes:
      - application/json
      description: Confirms an email address with the token from the emailed link
      parameters:
      - description: Token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.VerifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      summary: Verify email
      tags:
      - auth
  /api/v1/examples:
    get:
      consumes:
      - application/json
      description: Get all examples for the authenticated user with pagination
      parameters:
      - default: 1
        description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - default: 20
        description: 'Page size (default: 20, min: 1, max: 100)'
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_example.PaginatedExamplesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List examples (paginated)
      tags:
      - examples
    post:
      consumes:
      - application/json
      description: Create a new example for the authenticated user
      parameters:
      - description: Example details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_example.CreateExampleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_example.ExampleDataResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create example
      tags:
      - examples
  /api/v1/examples/{id}:
    delete:
      consumes:
      - application/json
      description: Delete an example for the authenticated user
      parameters:
      - description: Example ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_example.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete example
      tags:
      - examples
    get:
      consumes:
      - application/json
      description: Get an example by ID for the authenticated user
      parameters:
      - description: Example ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_example.ExampleDataResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get example
      tags:
      - examples
    put:
      consumes:
      - application/json
      description: Update an existing example for the authenticated user
      parameters:
      - description: Example ID
        in: path
        name: id
        required: true
        type: integer
      - description: Example details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_example.UpdateExampleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_example.ExampleDataResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update example
      tags:
      - examples
  /api/v1/uploads:
    get:
      description: Paginated list of the authenticated user's uploads, newest first
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_uploads.PaginatedUploadsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List uploads
      tags:
      - uploads
    post:
      consumes:
      - multipart/form-data
      description: Upload a file for the authenticated user
      parameters:
      - description: File to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_uploads.UploadDataResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app_internal_errs.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload file
      tags:
      - uploads
  /api/v1/uploads/{id}:
    delete:
      description: Delete an upload by ID
      parameters:
      - description: Upload ID
